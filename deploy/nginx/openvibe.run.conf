## ═══════════════════════════════════════════════════════════════
## openvibe.run — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.run.conf — keep them in sync and reload nginx
## after changing it. The Node app (port 4920, systemd unit openvibe-run) serves:
##
##   /api/v1/jobs…              the job API (run.job.submit|read|list|cancel|stream|admin); every
##                              request needs a Network service token for audience openvibe.run
##   /api/v1/jobs/{id}/stream   the job's Server-Sent Events (long-lived: never buffered or cached,
##                              Last-Event-ID forwarded so a reconnect resumes where it left)
##   /api/health, /api/ready, /release.json
##   /metrics                   Prometheus text, answered only to direct loopback callers (never proxied)
##   /internal/                 host-local service endpoints, refused here
##
## The client address reaches the app as $remote_addr only, same in X-Forwarded-For and CF-Connecting-IP:
## the header is set here, never appended to or passed through from the client, so the app's own view of
## who is calling cannot be spoofed. Run serves no page, no form and no cookie session.
##
## No proxy_cache: the API answers no-store, and an event stream must never be cached or buffered.
## Never log request bodies or the Authorization header: a service token and a stream ticket both ride
## in one.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovrun_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ovrun_stream:10m rate=2r/s;

# ── HTTP → HTTPS ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.run www.openvibe.run;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.run$request_uri; }
}

# ── www → apex ──────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.run;

    ssl_certificate     /etc/letsencrypt/live/openvibe.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.run/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.run$request_uri;
}

# ── The service ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.run;

    ssl_certificate     /etc/letsencrypt/live/openvibe.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.run/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.run.access.log;
    error_log  /var/log/nginx/openvibe.run.error.log;

    # The API accepts at most 768 kB of JSON (server/app.js; a job's args may be 512 KiB of it); 1 MB
    # leaves room for headers.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;          # the client address, from $remote_addr only
    proxy_set_header X-Forwarded-For $remote_addr;    # never appended to, never passed through
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── The job stream: Server-Sent Events ──────────────────
    # The ticket rides in ?ticket= (a browser cannot put a header on an EventSource), and a reconnect
    # resumes with Last-Event-ID, which is forwarded verbatim.
    location ~ ^/api/v1/jobs/job_[0-9A-HJKMNP-TV-Z]{26}/stream$ {
        limit_req zone=ovrun_stream burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4920;
        proxy_set_header Connection "";
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
    }

    # ── Health, readiness, the release manifest ─────────────
    location = /api/health   { proxy_pass http://127.0.0.1:4920; }
    location = /api/ready    { proxy_pass http://127.0.0.1:4920; }
    location = /release.json { proxy_pass http://127.0.0.1:4920; }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4920/metrics) ──
    # The app refuses a request that arrived through a proxy; the vhost refuses it at the edge too.
    location ~* ^/metrics(/|$) { return 404; }

    # ── Host-local service endpoints (Events deliveries, other services on this host) ──
    location ~* ^/internal(/|$) { return 404; }

    # ── The job API ─────────────────────────────────────────
    location /api/ {
        limit_req zone=ovrun_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4920;
    }

    # ── Nothing else is served ──────────────────────────────
    location / { return 404; }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
